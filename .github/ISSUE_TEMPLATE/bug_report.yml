name: Bug report
description: Something broke
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SigDeck version
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [signing, verification, armor, qr, cli, android app]
